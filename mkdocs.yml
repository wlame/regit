# ghdoc: version=1.2.0 engine=mkdocs color-scheme=blue-grey versioned=no updated=2026-07-19
# Organization documentation standard — mkdocs.yml
# Run: mkdocs build --strict

site_name: regit
site_description: A terminal UI and headless CLI for safely rewriting the commit history of your current git branch.
site_url: https://wlame.github.io/regit/

repo_name: wlame/regit
repo_url: https://github.com/wlame/regit
edit_uri: edit/main/docs/

strict: true
use_directory_urls: true

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    # Light mode (OS default)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue-grey
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue-grey
      accent: light-blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - content.tooltips
    - toc.follow

plugins:
  - search
  - tags
  - privacy
  # social cards are OPTIONAL — enabling them requires mkdocs-material[imaging]
  # plus system cairo libs in CI (see requirements-docs.txt). Off by default.
  # - social:
  #     enabled: !ENV [CI, false]
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
  - git-authors
  - redirects:
      redirect_maps: {}           # Add old-path: new-path entries here when moving pages
  - glightbox                     # Image zoom on click

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - def_list
  - abbr
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.tilde

nav:
  - Home: index.md
  - About: about.md
  - Getting started: getting-started.md
  - Use cases:
      - use-cases/index.md
      - Spread same-day commits: use-cases/spread-same-day-commits.md
      - Split an oversized commit: use-cases/split-large-commit.md
      - Polish commit messages: use-cases/polish-commit-messages.md
      - Remove secrets and files: use-cases/remove-secrets-from-history.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - Data flow: concepts/data-flow.md
  - Reference:
      - CLI:
          - reference/cli/index.md
          - split: reference/cli/split.md
          - reword: reference/cli/reword.md
          - squash: reference/cli/squash.md
          - linearize: reference/cli/linearize.md
          - redate: reference/cli/redate.md
          - retitle: reference/cli/retitle.md
          - reauthor: reference/cli/reauthor.md
          - drop-bodies: reference/cli/drop-bodies.md
          - purge: reference/cli/purge.md
          - redact: reference/cli/redact.md
          - undo: reference/cli/undo.md
          - install / uninstall: reference/cli/install.md
      - Configuration: reference/configuration.md
      - LLM providers: reference/llm-providers.md
  - Troubleshooting: troubleshooting.md
  - Changelog: changelog.md
  - Contributing: contributing.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/wlame/regit
  generator: false              # Remove "Made with MkDocs" footer

extra_css:
  - assets/stylesheets/extra.css

extra_javascript: []

# Builds the cross-platform release binaries and attaches them to a release.
#
# Trigger: publishing a release in the GitHub UI (or `gh release create`) for
# a vX.Y.Z tag. The build runs `just build-all` — the same recipe as locally —
# so one pure-Go ubuntu runner cross-compiles every platform without a matrix.

name: release

on:
  release:
    types: [published]

permissions:
  contents: write # required to upload assets to the release
  id-token: write # attest-build-provenance signs with a short-lived OIDC token
  attestations: write # …and records the resulting attestation on the repo

jobs:
  binaries:
    name: Build and attach binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          # Full history + tags so `git describe` stamps the exact release
          # version into the binaries instead of "dev".
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Install just
        # Third-party action pinned to a commit SHA (v2.0.0): this workflow's
        # token has contents:write, so a mutable tag would be a supply-chain
        # risk for the release assets.
        uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2.0.0

      - name: Cross-compile all platforms
        run: just build-all

      # Checksums let someone who downloaded a binary verify it matches what this
      # workflow produced. Generated with paths relative to dist/ so the file
      # works with a plain `sha256sum -c SHA256SUMS` from the download directory.
      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      # Signed, verifiable provenance tying each binary to this workflow run and
      # commit — `gh attestation verify <file> --repo wlame/regit`. Covers the
      # gap checksums cannot: a checksum only proves a file is self-consistent,
      # not that it came from here.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Attach binaries and checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.26.x"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Install just
        uses: extractions/setup-just@v2

      # One entrypoint: the same `just ci` a developer runs locally (fmt-check,
      # vet, build, and test-race with the coverage gate). CI and local cannot
      # drift because they invoke the identical recipe.
      - name: CI (fmt, vet, build, test-race, coverage gate)
        run: just ci
